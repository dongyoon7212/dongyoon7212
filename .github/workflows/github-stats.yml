name: GitHub-Stats-Cards

on:
  schedule:
    # 매일 UTC 18:10 = KST 새벽 3:10 (3D 잔디 직후)
    - cron: "10 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-stats-cards
    steps:
      - uses: actions/checkout@v5

      - name: Checkout generator (jstrieb/github-stats)
        uses: actions/checkout@v5
        with:
          repository: jstrieb/github-stats
          ref: master
          path: _generator

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build generator
        working-directory: _generator
        run: zig build

      - name: Generate SVG cards
        working-directory: _generator
        env:
          # classic PAT (read:user, user:email, repo). 토큰 소유자가 통계 대상이 됨.
          ACCESS_TOKEN: ${{ secrets.PROFILE_3D_TOKEN }}
          EXCLUDE_PRIVATE: "false"
          SILENT: "true"
          MAX_RETRIES: "5"
        run: ./zig-out/bin/github-stats

      - name: Copy cards into repo
        run: |
          mkdir -p github-stats
          cp _generator/overview.svg  github-stats/overview.svg
          cp _generator/languages.svg github-stats/languages.svg

      - name: Commit & Push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A github-stats
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "chore: update github stats cards"
          git push
