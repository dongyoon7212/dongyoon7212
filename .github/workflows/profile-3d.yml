name: GitHub-Profile-3D-Contrib

on:
  schedule:
    # 매일 UTC 18:00 = KST 새벽 3:00
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          # PROFILE_3D_TOKEN 시크릿이 있으면 그걸 쓰고(비공개 저장소 활동 포함),
          # 없으면 기본 GITHUB_TOKEN으로 폴백
          GITHUB_TOKEN: ${{ secrets.PROFILE_3D_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & Push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "chore: update 3d contribution graph"
          git push
